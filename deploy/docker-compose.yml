name: 8h8g

services:
  postgres:
    image: postgres:15-alpine
    container_name: 8h8g-postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-8h8g}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:-8h8g}
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER:-8h8g}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: 8h8g-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?err}', '--save', '60', '1000']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:?err}', 'PING']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  typesense:
    image: typesense/typesense:30.1
    container_name: 8h8g-typesense
    restart: unless-stopped
    volumes:
      - typesense-data:/data
    command: >
      --data-dir=/data
      --api-key=${TYPESENSE_API_KEY:?err}
      --enable-cors
      --listen-port=8108
    healthcheck:
      test: perl -MIO::Socket::INET -e 'exit(!IO::Socket::INET->new("127.0.0.1:8108"))'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  clickhouse:
    image: clickhouse/clickhouse-server:25.1
    container_name: 8h8g-clickhouse
    restart: unless-stopped
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?err}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-production_ariadne}
    healthcheck:
      test: ['CMD-SHELL', 'clickhouse-client --password ${CLICKHOUSE_PASSWORD:?err} --query "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  mail:
    image: axllent/mailpit:v1.27
    container_name: 8h8g-mail
    restart: unless-stopped
    environment:
      MP_ENABLE_SPAMASSASSIN: ''
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O/dev/null', 'http://localhost:8025/api/v1/info']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: 8h8g-gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --api-port=3000
      - --api-timeout=60s
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  redpanda:
    image: redpandadata/redpanda:v26.1.10
    container_name: 8h8g-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'info', '-X', 'brokers=localhost:9092']
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  labrinth:
    build:
      context: ..
      dockerfile: deploy/labrinth.Dockerfile
    image: 8h8g-labrinth:latest
    container_name: 8h8g-labrinth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      mail:
        condition: service_healthy
    volumes:
      - uploads-data:/data/uploads
    environment: &labrinth-env
      DEBUG: 'false'
      RUST_LOG: info,sqlx::query=warn
      SENTRY_DSN: ''
      SENTRY_ENVIRONMENT: production
      SITE_URL: ${SITE_URL:-https://bbsmc.org.cn}
      CDN_URL: ${CDN_URL:-https://cdn.bbsmc.org.cn}
      LABRINTH_ADMIN_KEY: ${LABRINTH_ADMIN_KEY:?err}
      LABRINTH_MEDAL_KEY: ''
      LABRINTH_EXTERNAL_NOTIFICATION_KEY: ${LABRINTH_EXTERNAL_NOTIFICATION_KEY:-beeffeed}
      LABRINTH_SUBSCRIPTIONS_KEY: ''
      RATE_LIMIT_IGNORE_KEY: ${RATE_LIMIT_IGNORE_KEY:?err}
      DATABASE_URL: postgresql://${POSTGRES_USER:-8h8g}:${POSTGRES_PASSWORD:?err}@postgres/${POSTGRES_DB:-8h8g}
      DATABASE_MIN_CONNECTIONS: '2'
      DATABASE_MAX_CONNECTIONS: '16'
      SEARCH_BACKEND: typesense
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?err}
      TYPESENSE_INDEX_PREFIX: 8h8g
      TYPESENSE_IMPORT_BATCH_SIZE: '5000'
      REDIS_MODE: standalone
      REDIS_CONNECTION_TYPE: pooled
      REDIS_CACHE_LOCKING_STRATEGY: local
      REDIS_URL: redis://default:${REDIS_PASSWORD:?err}@redis
      REDIS_MIN_CONNECTIONS: '2'
      REDIS_MAX_CONNECTIONS: '1000'
      REDIS_BLOCKING_MAX_CONNECTIONS: '8'
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_CLIENT_ID: '8h8g'
      BIND_ADDR: 0.0.0.0:8000
      SELF_ADDR: http://labrinth:8000
      MODERATION_SLACK_WEBHOOK: ''
      PUBLIC_DISCORD_WEBHOOK: ''
      CLOUDFLARE_INTEGRATION: 'false'
      STORAGE_BACKEND: local
      MOCK_FILE_PATH: /data/uploads
      S3_PUBLIC_BUCKET_NAME: none
      LOCAL_INDEX_INTERVAL: '3600'
      VERSION_INDEX_INTERVAL: '1800'
      RATE_LIMIT_IGNORE_IPS: '["127.0.0.1"]'
      WHITELISTED_MODPACK_DOMAINS: '["cdn.bbsmc.org.cn", "github.com", "raw.githubusercontent.com"]'
      ALLOWED_CALLBACK_URLS: '["localhost", ".bbsmc.org.cn", "127.0.0.1", "[::1]"]'
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-none}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-none}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-none}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-none}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-none}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-none}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-none}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-none}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-8h8g}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-no-reply@mail.bbsmc.org.cn}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_HOST: mail
      SMTP_PORT: '1025'
      SMTP_TLS: none
      HCAPTCHA_SECRET: ''
      SITE_VERIFY_EMAIL_PATH: auth/verify-email
      SITE_RESET_PASSWORD_PATH: auth/reset-password
      SITE_BILLING_PATH: ''
      ANALYTICS_ALLOWED_ORIGINS: '["http://localhost:3000", "https://bbsmc.org.cn", "https://www.bbsmc.org.cn"]'
      CLICKHOUSE_REPLICATED: 'false'
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?err}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-production_ariadne}
      STRIPE_API_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      PAYPAL_API_URL: ${PAYPAL_API_URL:-https://api-m.sandbox.paypal.com/v1/}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-none}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-none}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-none}
      PAYPAL_NVP_USERNAME: ${PAYPAL_NVP_USERNAME:-none}
      PAYPAL_NVP_PASSWORD: ${PAYPAL_NVP_PASSWORD:-none}
      PAYPAL_NVP_SIGNATURE: ${PAYPAL_NVP_SIGNATURE:-none}
      PAYPAL_BALANCE_ALERT_THRESHOLD: ${PAYPAL_BALANCE_ALERT_THRESHOLD:-0}
      SMTP_REPLY_TO_NAME: ${SMTP_REPLY_TO_NAME:-}
      SMTP_REPLY_TO_ADDRESS: ${SMTP_REPLY_TO_ADDRESS:-}

      # Chinese payment gateways
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-none}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-none}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-none}
      ALIPAY_GATEWAY_URL: ${ALIPAY_GATEWAY_URL:-https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-none}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-none}
      WECHATPAY_APP_ID: ${WECHATPAY_APP_ID:-none}
      WECHATPAY_MCH_ID: ${WECHATPAY_MCH_ID:-none}
      WECHATPAY_API_KEY: ${WECHATPAY_API_KEY:-none}
      WECHATPAY_API_V3_KEY: ${WECHATPAY_API_V3_KEY:-none}
      WECHATPAY_NOTIFY_URL: ${WECHATPAY_NOTIFY_URL:-none}
      EPAY_API_URL: ${EPAY_API_URL:-none}
      EPAY_PID: ${EPAY_PID:-none}
      EPAY_KEY: ${EPAY_KEY:-none}
      EPAY_NOTIFY_URL: ${EPAY_NOTIFY_URL:-none}
      EPAY_RETURN_URL: ${EPAY_RETURN_URL:-none}
      CODEPAY_API_URL: ${CODEPAY_API_URL:-none}
      CODEPAY_APP_ID: ${CODEPAY_APP_ID:-none}
      CODEPAY_APP_SECRET: ${CODEPAY_APP_SECRET:-none}
      CODEPAY_NOTIFY_URL: ${CODEPAY_NOTIFY_URL:-none}
      CODEPAY_RETURN_URL: ${CODEPAY_RETURN_URL:-none}
      GOTENBERG_URL: http://gotenberg:3000
      GOTENBERG_CALLBACK_BASE: http://labrinth:8000/_internal/gotenberg
      GOTENBERG_TIMEOUT: '30000'
      WEBAUTHN_RP_NAME: '8h8g'
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  # 搜索增量索引消费者。
  # labrinth 主进程只把项目变更事件投递到 Kafka，必须由这个独立进程消费并写入
  # Typesense。不运行它的话，审核通过的项目永远不会出现在搜索/浏览页。
  labrinth-indexer:
    # 复用 labrinth 镜像，避免重复编译 Rust
    image: 8h8g-labrinth:latest
    container_name: 8h8g-labrinth-indexer
    restart: unless-stopped
    command: ['/labrinth/labrinth', '--run-background-task', 'incremental-index-search']
    depends_on:
      labrinth:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    volumes:
      - uploads-data:/data/uploads
    environment: *labrinth-env
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    container_name: 8h8g-frontend
    restart: unless-stopped
    depends_on:
      - labrinth
    environment:
      NODE_ENV: production
      HOST: '0.0.0.0'
      PORT: '3000'
      BASE_URL: ${API_URL:-https://api.bbsmc.org.cn/v2/}
      BROWSER_BASE_URL: ${API_URL:-https://api.bbsmc.org.cn/v2/}
      SHARED_INSTANCES_API_BASE_URL: https://shared-instances.bbsmc.org.cn
      PYRO_BASE_URL: https://archon.bbsmc.org.cn
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G

  nginx:
    image: nginx:alpine
    container_name: 8h8g-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./ssl:/etc/nginx/ssl
      - uploads-data:/data/uploads:ro
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    depends_on:
      - frontend
      - labrinth
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres-data:
  redis-data:
  typesense-data:
  clickhouse-data:
  redpanda-data:
  uploads-data:
